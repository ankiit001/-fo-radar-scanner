
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANKIT SMART SCANNER</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1220;color:#f1f5f9;font-family:Arial,sans-serif}
header{padding:20px;background:#172438;text-align:center}
header h2{margin:0;color:#60a5fa}
header p{color:#aab8ca;font-size:12px}
main{padding:14px;max-width:700px;margin:auto}
.panel{background:#172438;padding:16px;border-radius:12px;margin:13px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.signal{padding:16px;border-radius:10px;background:#26364d}
.ce{color:#4ade80}.pe{color:#fb7185}
button{padding:12px;border:0;border-radius:8px;background:#2563eb;color:white;font-weight:bold;margin:4px;cursor:pointer}
input{max-width:100%;margin:10px 0}
small{color:#aab8ca}
.result{background:#26364d;padding:13px;margin:10px 0;border-radius:9px}
label{display:block;margin-top:10px}
</style>
</head>
<body>
<header>
<h2>ANKIT SMART SCANNER</h2>
<p>NSE F&O | CE + PE | 5 MINUTES</p>
</header>
<main>
<div class="panel">
<h3>Scanner Status</h3>
<p id="status">Backend जाँच रहे हैं...</p>
<p>Capital: <b>₹2,000</b></p>
<p>Timeframe: <b>5 Minutes</b></p>
<small>Manual Trading Only | No Auto Orders</small>
</div>

<div class="grid">
<div class="signal">
<h3 class="ce">CE BUY</h3>
<p>Bullish Signals</p>
</div>
<div class="signal">
<h3 class="pe">PE BUY</h3>
<p>Bearish Signals</p>
</div>
</div>

<div class="panel">
<h3>CSV Market Scanner</h3>
<input type="file" id="csvfile" accept=".csv">
<button onclick="uploadCSV()">UPLOAD & SCAN</button>
</div>

<div class="panel">
<h3>Trading Signals</h3>
<button onclick="show('BUY')">BUY</button>
<button onclick="show('SELL')">SELL</button>
<div id="results">CSV अपलोड करके स्कैन करें।</div>
</div>
</main>

<script>
let allResults=[];

async function checkBackend(){
try{
const r=await fetch('/health');
document.getElementById('status').textContent=
r.ok?'Backend Online':'Backend Error';
}catch(e){
document.getElementById('status').textContent=
'Backend उपलब्ध नहीं';
}
}

async function uploadCSV(){
const file=document.getElementById('csvfile').files[0];
if(!file){alert('पहले CSV फाइल चुनें');return;}

const data=new FormData();
data.append('file',file);
document.getElementById('results').textContent='Scanning...';

try{
const r=await fetch('/scan/csv',{
method:'POST',body:data
});
const result=await r.json();
if(!r.ok)throw new Error(JSON.stringify(result));

allResults=result.results||[];
show('BUY');
}catch(e){
document.getElementById('results').textContent=
'Error: '+e.message;
}
}

function show(direction){
const rows=allResults.filter(x=>x.direction===direction);
const el=document.getElementById('results');

if(!rows.length){
el.textContent='कोई '+direction+' Signal नहीं मिला।';
return;
}

el.innerHTML=rows.map(x=>`
<div class="result">
<h3>${x.symbol} - ${x.direction}</h3>
<p>Score: ${x.score}</p>
<p>Close: ₹${x.close}</p>
<p>RSI: ${x.rsi} | ADX: ${x.adx}</p>
<p>Volume Ratio: ${x.volume_ratio}</p>
<p>Entry: Backend में उपलब्ध होने पर दिखेगा</p>
<p>Stop Loss: Pending</p>
<p>Target 1: Pending</p>
<p>Target 2: Pending</p>
<small>${(x.reasons||[]).join(' | ')}</small>
</div>
`).join('');
}

checkBackend();
</script>
</body>
</html>
